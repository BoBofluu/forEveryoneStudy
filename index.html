<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日文學習口袋書</title>

    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/calendar.css">
    <!-- 引入日文自動分詞與假名標註引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
</head>

<body>

    <header class="app-header">
        <h1 id="pageTitle">日文學習口袋書</h1>
    </header>

    <main class="main-content">
        <div id="pageInput" class="page active">
            <div class="input-group" style="display: flex; gap: 30px; margin-bottom: 20px; flex-wrap: wrap;">
                <!-- 左欄：分類 (50%) -->
                <div style="flex: 1; min-width: 300px;">
                    <label style="display: block; margin-bottom: 10px;">分類</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select id="categoryInput" onchange="handleCategoryChange()"
                            style="flex: 1; height: 38px; margin-bottom: 0; padding: 6px 12px;">
                        </select>
                        <button class="action-btn" onclick="manageCategories()"
                            style="font-size: 13px; height: 38px; padding: 0 15px; background-color: var(--input-bg); border: 1px solid #555; white-space: nowrap;">管理分類</button>
                    </div>
                </div>

                <!-- 右欄：子分類 (50%) -->
                <div style="flex: 1; min-width: 300px;">
                    <label style="display: block; margin-bottom: 10px;">子分類 (選填 - 可複選)</label>
                    <div id="subcategoryPills"
                        style="display: flex; flex-wrap: wrap; gap: 6px; min-height: 38px; align-items: center;">
                        <span style="color: var(--text-sub); font-size: 13px;">請先選擇主分類</span>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <div style="display:flex; align-items:center; gap:12px;">
                    <label style="margin-bottom:0;">標題 (選填)</label>
                    <button id="btn_toggleInputEn" class="action-btn" onclick="toggleInputEn()"
                        style="font-size:12px; padding:4px 12px; background-color:var(--input-bg); border:1px solid #555;">顯示英文欄位</button>
                </div>
                <input type="text" id="titleInput" placeholder="這篇筆記的標題..." style="margin-top:10px;">
            </div>

            <div id="enInputGroup" class="input-group" style="display:none; margin-bottom: 20px;">
                <label>英文內容</label>
                <textarea id="enInput" oninput="autoResize(this)"
                    placeholder="例：The hotel can accommodate up to 500 guests." style="margin-top:10px;"></textarea>
            </div>

            <div class="input-group">
                <label style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px;">
                    <span id="jpInputLabel">日文內容</span>
                </label>
                <div class="jp-action-bar">
                    <select class="template-select" id="inputTemplateSelect"></select>
                    <button class="action-btn" onclick="insertTemplate('jpInput', 'inputTemplateSelect')">插入模板</button>
                    <button class="action-btn" onclick="manageTemplates()">管理模板</button>
                </div>
                <textarea id="jpInput" oninput="autoResize(this)" placeholder="例：お手数をおかけしますが"></textarea>
            </div>

            <div class="input-group">
                <label>備註 / 中文解釋</label>
                <textarea id="noteInput" oninput="autoResize(this)" placeholder="輸入中文解釋或使用情境..."></textarea>
            </div>

            <button class="submit-btn" onclick="saveItem()">儲存到清單</button>
        </div>

        <div id="pageList" class="page">
            <div class="list-control-panel sticky-header">
                <div style="display: flex; gap: 20px; align-items: flex-start;">
                    <!-- 左側控制區塊 (搜尋、條件、按鈕) -->
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
                        <!-- 第一列：搜尋欄 -->
                        <input type="text" id="searchInput" placeholder="搜尋關鍵字..." onkeyup="renderList()"
                            style="height: 38px; width: 100%;">

                        <!-- 第二列：Checkbox + 排序 -->
                        <div
                            style="display: flex; align-items: center; justify-content: space-between; gap: 15px; background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 8px;">
                            <div class="search-options" id="searchOptionsContainer" style="gap: 10px;">
                                <label><input type="checkbox" id="searchTitle" checked
                                        onchange="renderList()">標題</label>
                                <label><input type="checkbox" id="searchCat" checked onchange="renderList()">分類</label>
                                <label><input type="checkbox" id="searchJp" checked onchange="renderList()">日文</label>
                                <label><input type="checkbox" id="searchEn" checked onchange="renderList()">英文</label>
                                <label><input type="checkbox" id="searchNote" checked onchange="renderList()">備註</label>
                                <label><input type="checkbox" id="searchSubcat" checked
                                        onchange="renderList()">子分類</label>
                                <div class="option-btns" style="margin-left: 5px;">
                                    <button onclick="toggleSearchCheckboxes(true)">全選</button>
                                    <button onclick="toggleSearchCheckboxes(false)">清除</button>
                                </div>
                            </div>
                            <select id="sortOrder" onchange="renderList()" class="sort-select"
                                style="width: 100px !important;">
                                <option value="newest">最新排序</option>
                                <option value="oldest">最舊排序</option>
                            </select>
                        </div>

                        <!-- 第三列：篩選與功能按鈕 -->
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <button class="action-btn filter-trigger" onclick="openFilterModal()"
                                style="flex: 0 0 auto; min-width: 160px; height: 38px; background-color: var(--input-bg); border: 1px solid #555;">
                                🔍 篩選分類與日期
                            </button>
                            <div style="display: flex; gap: 8px; flex: 1;">
                                <button class="action-btn" onclick="exportData()"
                                    style="height: 38px; background-color: var(--input-bg); border: 1px solid #555;">📤
                                    匯出資料</button>
                                <button class="action-btn" onclick="importData()"
                                    style="height: 38px; background-color: var(--input-bg); border: 1px solid #555;">📥
                                    匯入資料</button>
                                <input type="file" id="importFile" style="display:none;" accept=".json"
                                    onchange="handleImport(event)">
                            </div>
                        </div>
                    </div>

                    <div id="inlineCalendar" class="mini-calendar" style="flex: 0 0 220px;"></div>
                </div>
            </div>

            <div id="listContainer"></div>
        </div>

        <div id="pageDetail" class="page">
            <div class="sticky-header">
                <button class="back-btn" onclick="switchPage('list')">
                    <span style="margin-right:5px;font-size:20px;"></span> 返回清單
                </button>
            </div>
            <div id="detailContainer" class="item-card"></div>
        </div>
    </main>

    <nav class="tab-bar">
        <button class="tab-item active" onclick="switchPage('input')" id="tabInput">
            <span class="tab-icon"></span>
            <span class="tab-label">輸入</span>
        </button>
        <button class="tab-item" onclick="switchPage('list')" id="tabList">
            <span class="tab-icon"></span>
            <span class="tab-label">清單</span>
        </button>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/tts.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
