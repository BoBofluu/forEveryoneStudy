<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日文學習口袋書</title>

    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="app-header">
        <h1 id="pageTitle">日文學習口袋書</h1>
    </header>

    <main class="main-content">
        <div id="pageInput" class="page active">
            <div class="input-group">
                <label>分類</label>
                <select id="categoryInput" onchange="handleCategoryChange()">
                    <!-- Categories will be generated by JS -->
                </select>

                <label style="margin-top:10px;">子分類 (選填 - 可複選)</label>
                <div id="subcategoryPills" style="display:flex; flex-wrap:wrap; gap:6px; min-height: 38px; padding: 5px 0;">
                    <span style="color:var(--text-sub); font-size:13px; margin:auto 0;">請先選擇主分類</span>
                </div>

                <button class="action-btn" onclick="manageCategories()" style="margin-top: 8px;">管理分類</button>
            </div>

            <div class="input-group">
                <label>標題 (選填)</label>
                <input type="text" id="titleInput" placeholder="這篇筆記的標題...">
            </div>

            <div id="enInputGroup" class="input-group" style="display:none;">
                <label style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px;">
                    英文內容
                </label>
                <div class="jp-action-bar">
                    <button class="action-btn" onclick="playAudio('enInput', 'en-US')" title="朗讀英文">🔊 朗讀英文</button>
                    <button class="action-btn" onclick="copyToClipboard('enInput')" style="background-color:var(--input-bg);">複製內容</button>
                </div>
                <textarea id="enInput" oninput="autoResize(this)" placeholder="例：The hotel can accommodate up to 500 guests."></textarea>
            </div>

            <div class="input-group">
                <label style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px;">
                    <span id="jpInputLabel">日文內容</span>
                </label>
                <div class="jp-action-bar">
                    <select class="template-select" id="inputTemplateSelect"></select>
                    <button class="action-btn" onclick="insertTemplate('jpInput', 'inputTemplateSelect')">插入模板</button>
                    <button class="action-btn" onclick="manageTemplates()">管理模板</button>
                    <button id="jpAudioBtn" class="action-btn" onclick="playAudio('jpInput', 'ja-JP')" title="朗讀日文" style="display:none;">🔊 朗讀</button>
                </div>
                <textarea id="jpInput" oninput="autoResize(this)" placeholder="例：お手数をおかけしますが"></textarea>
            </div>

            <div class="input-group">
                <label>備註 / 中文解釋</label>
                <textarea id="noteInput" oninput="autoResize(this)" placeholder="輸入中文解釋或使用情境..."></textarea>
            </div>

            <button class="submit-btn" onclick="saveItem()">儲存到清單</button>
        </div>

        <div id="pageList" class="page">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <button class="action-btn" onclick="exportData()"
                    style="flex:1; justify-content:center; margin-right:8px; background-color:var(--input-bg);">匯出資料
                    (備份)</button>
                <button class="action-btn" onclick="importData()"
                    style="flex:1; justify-content:center; background-color:var(--input-bg);">匯入資料 (復原)</button>
                <input type="file" id="importFile" style="display:none;" accept=".json" onchange="handleImport(event)">
            </div>
            <div class="search-container">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap: 10px;">
                    <div class="pill-filters" style="display:flex; gap:6px; overflow-x:auto; padding-bottom:5px; flex-grow:1;">
                        <button class="pill-btn active" onclick="setCatFilter('all')" id="filterCat_all">全部</button>
                        <button class="pill-btn active" onclick="setCatFilter('all')" id="filterCat_all">全部</button>
                        <!-- Category pills will be generated by JS -->
                    </div>
                    
                    <div id="inlineCalendar" class="inline-calendar" style="margin: 0; min-width: 180px;"></div>

                    <select id="sortOrder" onchange="renderList()"
                        style="width:auto; padding:5px 8px; font-size:13px; border-radius:6px; max-width:90px;">
                        <option value="newest">最新</option>
                        <option value="oldest">最舊</option>
                    </select>
                </div>
                <input type="text" id="searchInput" placeholder="搜尋關鍵字..." onkeyup="renderList()">
                <div class="search-options"
                    style="display:flex; gap:10px; margin-top:10px; font-size:14px; color:var(--text-sub); flex-wrap:wrap;">
                    <label style="display:flex; align-items:center; margin:0;"><input type="checkbox" id="searchTitle"
                            checked onchange="renderList()" style="width:auto; margin-right:4px;">標題</label>
                    <label style="display:flex; align-items:center; margin:0;"><input type="checkbox" id="searchCat"
                            checked onchange="renderList()" style="width:auto; margin-right:4px;">分類</label>
                    <label style="display:flex; align-items:center; margin:0;"><input type="checkbox" id="searchJp"
                            checked onchange="renderList()" style="width:auto; margin-right:4px;">內容</label>
                    <label style="display:flex; align-items:center; margin:0;"><input type="checkbox" id="searchNote"
                            checked onchange="renderList()" style="width:auto; margin-right:4px;">備註</label>
                </div>
            </div>

            <div id="listContainer"></div>
        </div>

        <div id="pageDetail" class="page">
            <div class="sticky-header">
                <button class="back-btn" onclick="switchPage('list')">
                    <span style="margin-right:5px;font-size:20px;"></span> 返回清單
                </button>
            </div>
            <div id="detailContainer" class="item-card"></div>
        </div>
    </main>

    <nav class="tab-bar">
        <button class="tab-item active" onclick="switchPage('input')" id="tabInput">
            <span class="tab-icon"></span>
            <span class="tab-label">輸入</span>
        </button>
        <button class="tab-item" onclick="switchPage('list')" id="tabList">
            <span class="tab-icon"></span>
            <span class="tab-label">清單</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>

</html>
